<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIG-Log People</title><link rel="stylesheet" href="css/app.css"></head><body>
<div id="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brandmark">JL</span><div><b>JornadaLog</b><small>SIG-Log People</small></div></div><nav id="nav"></nav><div class="version">MVP 4.1 · People</div></aside>
<div class="shell"><header class="topbar"><button class="icon mobile" id="menuBtn" aria-label="Abrir menu">☰</button><div class="crumb"><small id="eyebrow">NÍVEL GERENCIAL</small><h1 id="title">Visão Geral</h1></div><div class="top-actions"><label class="search"><span>⌕</span><input id="globalSearch" placeholder="Pesquisar pessoas, escalas ou conflitos"></label><button class="primary" id="quickBtn">＋ Novo</button><button class="status good" id="apiStatus" title="Integridade da API">● API</button><button class="icon" id="notificationBtn" aria-label="Notificações">🔔 <b id="notificationCount">0</b></button><select id="roleSelect" aria-label="Perfil"><option value="GESTOR_OPERACOES">Gestor de Operações</option><option value="GESTOR_RH">Gestor de RH</option><option value="OPERADOR">Operador</option><option value="PROFISSIONAL">Profissional</option><option value="ADMIN">Administrador</option></select><span class="avatar">UD</span></div></header><main id="content" tabindex="-1"></main></div></div>
<div class="drawer" id="drawer" aria-hidden="true"><div class="drawer-head"><h3>Notificações</h3><button class="icon" data-close>×</button></div><div id="drawerContent"></div></div><div class="backdrop" id="backdrop"></div>
<div class="modal" id="modal" aria-hidden="true"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">Nova ação</h3><button class="icon" data-close>×</button></div><div id="modalBody"></div></div></div><div id="toast" aria-live="polite"></div>
<script type="module" src="js/app.js"></script></body></html>
