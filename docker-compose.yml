
services:
  postgres:
    image: postgres:18
    container_name: rh_jornada_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: RH_Jornada
      POSTGRES_USER: rh_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - rh_jornada_data:/var/lib/postgresql
      - ./database:/docker-entrypoint-initdb.d:ro

volumes:
  rh_jornada_data:
