
services:
  postgres:
    image: postgres:18
    container_name: rh_jornada_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: RH_Jornada
      POSTGRES_USER: rh_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - rh_jornada_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rh_jornada_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rh_jornada_rabbitmq_data:/var/lib/rabbitmq

volumes:
  rh_jornada_data:
  rh_jornada_rabbitmq_data:
