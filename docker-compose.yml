
services:
  postgres:
    image: postgres:18
    container_name: rh_jornada_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: RH_Jornada
      POSTGRES_USER: rh_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - rh_jornada_data:/var/lib/postgresql

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: rh_jornada_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/RH_Jornada?sslmode=disable
      DATA_SOURCE_USER: rh_admin
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rh_jornada_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rh_jornada_rabbitmq_data:/var/lib/rabbitmq

  prometheus:
    image: prom/prometheus:latest
    container_name: rh_jornada_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: rh_jornada_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.13.0
    container_name: rh_jornada_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: rh_jornada_otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./monitoring/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - jaeger

volumes:
  rh_jornada_data:
  rh_jornada_rabbitmq_data:
  prometheus_data:
  grafana_data:
