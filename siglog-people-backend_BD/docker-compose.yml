# Banco local de desenvolvimento. Uso:
#   cp .env.example .env   (defina POSTGRES_PASSWORD)
#   docker compose up -d
#   python database/scripts/executar_migrations.py && python database/scripts/executar_seeds.py
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-RH_Jornada}
      POSTGRES_USER: ${POSTGRES_USER:-rh_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rh_admin} -d ${POSTGRES_DB:-RH_Jornada}"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
